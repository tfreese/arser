// Trigger JAXB generation.
// compileJava.dependsOn(":arser-configuration:build")

Directory destDir = layout.buildDirectory.get().dir("generated").dir("jaxb")

sourceSets {
    main {
        java {
            srcDir(destDir)
        }
    }
}

tasks.register("genJaxb", JavaExec) {
    group = "arser"

    Directory resourcesDir = layout.projectDirectory.dir("src").dir("main").dir("resources").dir("config")
    RegularFile schema = resourcesDir.file("arser-config.xsd")
    RegularFile binding = resourcesDir.file("binding.xjb")

    inputs.file(schema)
    inputs.file(binding)
    outputs.dir(destDir)

    classpath = configurations.jaxb
    mainClass = "com.sun.tools.xjc.Driver"

    doFirst {
        logger.lifecycle("Lösche generierte JAXB-Dateien in ${destDir.asFile}")
        delete(destDir)
        destDir.asFile.mkdirs()
    }

    args(
            "-d", destDir.asFile.absolutePath,
            "-b", binding.asFile.absolutePath,
            "-p", "de.freese.arser.config.xml",
            "-encoding", compileJava.options.encoding,
            "-extension", "-npa",
            schema.asFile.absolutePath
    )

    // String xjcToolsClasspath = configurations.jaxb.asPath
