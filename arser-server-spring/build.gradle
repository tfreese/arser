tasks.named("processResources", ProcessResources) {
    def map = [
        "project_description": project.description,
        "project_artifactId" : project.name,
        "project_version"    : project.version
    ]

    filesMatching("application.yml") {
        filter { line ->
            line
                .replace("@project_description@", map.project_description.toString())
                .replace("@project_artifactId@", map.project_artifactId.toString())
                .replace("@project_version@", map.project_version.toString())
        }
    }
}

tasks.register("copyLibsServerSpring", Copy) {
    group = "arser"
    description = "Copy all runtime dependencies to build/libs"

    delete(layout.buildDirectory.dir("libs"))

    into(layout.buildDirectory)

    into("libs") {
        from(configurations.runtimeClasspath)
    }
}
